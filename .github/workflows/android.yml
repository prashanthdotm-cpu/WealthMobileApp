name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: tools platform-tools

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Install npm dependencies
        run: |
          cd WealthApp-Mobile
          npm ci

      - name: Check web assets for AR references
        run: |
          echo "========== CHECKING www/ FOR AR REFERENCES =========="
          grep -rni "arcore\|webar\|webxr\|immersive-ar\|navigator\.xr\|aframe\|mindar\|8thwall\|AR\.js\|ar\.js\|XRSession\|requestSession" WealthApp-Mobile/www/ || echo "✅ No AR keywords found in www/"
          echo "========== END CHECK =========="

      - name: Destroy and recreate Android platform fresh
        run: |
          cd WealthApp-Mobile
          rm -rf android
          npx cap add android

      - name: Strip ARCore (before sync)
        run: |
          cd WealthApp-Mobile/android
          MANIFEST="app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/android.hardware.camera.ar/d' "$MANIFEST"
            sed -i '/com.google.ar.core/d' "$MANIFEST"
            sed -i '/ARCore/d' "$MANIFEST"
            sed -i '/arcore/d' "$MANIFEST"
            sed -i '/com.google.ar/d' "$MANIFEST"
            sed -i '/uses-feature.*camera\.ar/d' "$MANIFEST"
            sed -i '/meta-data.*ar\.core/d' "$MANIFEST"
            echo "=== Manifest after initial strip ==="
            cat "$MANIFEST"
          fi
          find . -name "build.gradle" -o -name "build.gradle.kts" | while read f; do
            sed -i '/arcore/Id' "$f"
            sed -i '/ARCore/Id' "$f"
            sed -i '/com\.google\.ar/Id' "$f"
          done
          if [ -f "gradle.properties" ]; then
            sed -i '/arcore/Id' gradle.properties
            sed -i '/ARCore/Id' gradle.properties
          fi

      - name: Sync Capacitor
        run: |
          cd WealthApp-Mobile
          npx cap sync android

      - name: Final aggressive ARCore strip (after sync)
        run: |
          cd WealthApp-Mobile/android
          MANIFEST="app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/android.hardware.camera.ar/d' "$MANIFEST"
            sed -i '/com.google.ar.core/d' "$MANIFEST"
            sed -i '/ARCore/d' "$MANIFEST"
            sed -i '/arcore/d' "$MANIFEST"
            sed -i '/com.google.ar/d' "$MANIFEST"
            sed -i '/uses-feature.*camera\.ar/d' "$MANIFEST"
            sed -i '/meta-data.*ar\.core/d' "$MANIFEST"
            echo "=== Final AndroidManifest.xml ==="
            cat "$MANIFEST"
          fi
          find . -name "build.gradle" -o -name "build.gradle.kts" | while read f; do
            sed -i '/arcore/Id' "$f"
            sed -i '/ARCore/Id' "$f"
            sed -i '/com\.google\.ar/Id' "$f"
          done

      - name: Build Debug APK
        run: |
          cd WealthApp-Mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK (must pass)
        run: |
          APK="WealthApp-Mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          echo "========== APK SIZE =========="
          ls -lh "$APK"
          echo ""
          echo "========== strings search =========="
          unzip -p "$APK" AndroidManifest.xml | strings | grep -iE "arcore|camera\.ar|com\.google\.ar" && exit 1 || echo "✅ PASS: No ARCore via strings"
          echo ""
          echo "========== aapt2 dump =========="
          AAPT2=$(find $ANDROID_HOME -name aapt2 | head -1)
          if [ -n "$AAPT2" ]; then
            $AAPT2 dump xmltree "$APK" AndroidManifest.xml | grep -iE "arcore|camera\.ar|com\.google\.ar" && exit 1 || echo "✅ PASS: aapt2 found no ARCore entries"
          else
            echo "aapt2 not found"

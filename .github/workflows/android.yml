name: Build WealthApp Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Install dependencies
        working-directory: WealthApp-Mobile
        run: npm install

      - name: Install TypeScript
        working-directory: WealthApp-Mobile
        run: npm install --save-dev typescript

      - name: Add Android platform
        working-directory: WealthApp-Mobile
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: WealthApp-Mobile
        run: npx cap sync android

      - name: Build Android APK
        working-directory: WealthApp-Mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Check APK
        run: |
          ls -lh WealthApp-Mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WealthApp-Android-APK
          path: WealthApp-Mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

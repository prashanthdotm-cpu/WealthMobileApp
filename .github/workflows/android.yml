name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: tools platform-tools

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Install npm dependencies
        run: |
          cd WealthApp-Mobile
          npm ci

      - name: Check web assets for AR references
        run: |
          echo "========== CHECKING www/ FOR AR REFERENCES =========="
          grep -rni "arcore\|webar\|webxr\|immersive-ar\|navigator\.xr\|aframe\|mindar\|8thwall" WealthApp-Mobile/www/ || echo "No AR keywords found in www/"
          echo "========== END CHECK =========="

      - name: Destroy and recreate Android platform fresh
        run: |
          cd WealthApp-Mobile
          rm -rf android
          npx cap add android

      - name: Strip ARCore from generated Android project
        run: |
          cd WealthApp-Mobile/android
          
          # 1. Strip from AndroidManifest.xml
          MANIFEST="app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/android.hardware.camera.ar/d' "$MANIFEST"
            sed -i '/com.google.ar.core/d' "$MANIFEST"
            sed -i '/ARCore/d' "$MANIFEST"
            sed -i '/arcore/d' "$MANIFEST"
            echo "=== AndroidManifest.xml (ARCore stripped) ==="
            cat "$MANIFEST"
          fi
          
          # 2. Strip from all build.gradle files
          find . -name "build.gradle" -exec sed -i '/arcore/d' {} \;
          find . -name "build.gradle" -exec sed -i '/ARCore/d' {} \;
          find . -name "build.gradle" -exec sed -i '/com.google.ar/d' {} \;
          
          # 3. Strip from gradle.properties
          if [ -f "gradle.properties" ]; then
            sed -i '/arcore/d' gradle.properties
            sed -i '/ARCore/d' gradle.properties
          fi
          
          echo "=== Gradle files cleaned ==="

      - name: Sync Capacitor
        run: |
          cd WealthApp-Mobile
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd WealthApp-Mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK manifest (critical check)
        run: |
          APK="WealthApp-Mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          echo "========== APK MANIFEST VERIFICATION =========="
          unzip -p "$APK" AndroidManifest.xml | strings | grep -i "arcore\|camera.ar\|com.google.ar" || echo "✅ PASS: No ARCore references found in APK manifest"
          echo "========== END VERIFICATION =========="
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WealthApp-debug-apk
          path: WealthApp-Mobile/android/app/build/outputs/apk/debug/app-debug.apk

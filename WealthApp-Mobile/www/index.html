/* ---- NEW DASHBOARD (from v1.0) ---- */
.new-dashboard { padding-bottom: 8px; }
.new-dashboard .welcome { margin-bottom: 20px; }
.new-dashboard .welcome h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; color: #022E29; }
.dark .new-dashboard .welcome h1 { color: #E7F8F2; }
.new-dashboard .welcome p { color: #697386; font-size: 13px; margin-top: 4px; }
.dark .new-dashboard .welcome p { color: #94a3b8; }

.new-dashboard .cards {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}
@media (min-width: 640px) {
  .new-dashboard .cards { grid-template-columns: repeat(4, 1fr); }
}

.new-dashboard .card {
  background: #fff;
  border: 1px solid #E7F8F2;
  border-radius: 1.25rem;
  box-shadow: 0 2px 12px rgba(7,94,84,.06);
  padding: 16px;
}
.dark .new-dashboard .card {
  background: #033D37;
  border-color: #054C44;
}

.new-dashboard .metric-label { color: #697386; font-size: 12px; margin-bottom: 6px; font-weight: 600; }
.dark .new-dashboard .metric-label { color: #94a3b8; }
.new-dashboard .metric-value { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; color: #022E29; }
.dark .new-dashboard .metric-value { color: #E7F8F2; }
.new-dashboard .metric-sub { font-size: 11px; margin-top: 6px; color: #697386; }
.dark .new-dashboard .metric-sub { color: #94a3b8; }

.new-dashboard .dashboard-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
  margin-bottom: 20px;
}
@media (min-width: 768px) {
  .new-dashboard .dashboard-grid { grid-template-columns: 1.5fr 1fr; }
}

.new-dashboard .card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.new-dashboard .card-title { font-weight: 700; font-size: 15px; color: #022E29; }
.dark .new-dashboard .card-title { color: #E7F8F2; }
.new-dashboard .card-action {
  color: #128C7E;
  background: transparent;
  border: 0;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}

.new-dashboard .chart {
  height: 200px;
  display: flex;
  align-items: end;
  gap: 10px;
  padding: 20px 4px 24px;
}
.new-dashboard .bar-group {
  flex: 1;
  height: 100%;
  display: flex;
  align-items: end;
  justify-content: center;
  position: relative;
}
.new-dashboard .bar {
  width: 70%;
  max-width: 40px;
  border-radius: 6px 6px 3px 3px;
  min-height: 8px;
  position: relative;
  transition: height 0.4s ease;
}
.new-dashboard .bar-value {
  position: absolute;
  top: -20px;
  width: 100%;
  text-align: center;
  font-size: 9px;
  color: #697386;
  white-space: nowrap;
  font-weight: 600;
}
.dark .new-dashboard .bar-value { color: #94a3b8; }
.new-dashboard .bar-label {
  position: absolute;
  bottom: -20px;
  font-size: 9px;
  color: #697386;
  text-align: center;
  width: 100%;
}
.dark .new-dashboard .bar-label { color: #94a3b8; }

.new-dashboard .allocation-layout {
  display: grid;
  grid-template-columns: 1fr;
  gap: 20px;
  align-items: center;
}
@media (min-width: 640px) {
  .new-dashboard .allocation-layout { grid-template-columns: 140px 1fr; }
}

.new-dashboard .donut {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  margin: auto;
}
.new-dashboard .donut-inner {

  height: 90px;
  border-radius: 50%;

/* ---------------- RATES ---------------- */

/* ---------------- HELPERS ---------------- */

function clone(x){
  return JSON.parse(JSON.stringify(x));
}


function loadData(){

  try{

    const saved =
      JSON.parse(localStorage.getItem('wa-data'));

    if(
      saved &&
      Array.isArray(saved.assets) &&
      Array.isArray(saved.categories)
    ){

      return saved;

    }

  }catch(e){}

  return clone(DEFAULT_DATA);
}


function saveData(){

  localStorage.setItem(
    'wa-data',
    JSON.stringify(DATA)
  );

}


function conv(n){

  const r = RATES[currency];

  const v =
    Number(n || 0) * r.rate;

  if(currency === 'INR'){

    if(v >= 10000000){

      return r.symbol +
        (v/10000000).toFixed(2) +
        ' Cr';

    }

    if(v >= 100000){

      return r.symbol +
        (v/100000).toFixed(2) +
        ' L';

    }

    return r.symbol +
      Math.round(v).toLocaleString('en-IN');

  }

  return r.symbol +
    Math.round(v).toLocaleString('en-US');

}


function convFull(n){

  const r = RATES[currency];

  return r.symbol +
    Math.round(
      Number(n || 0) * r.rate
    ).toLocaleString(
      currency === 'INR'
        ? 'en-IN'
        : 'en-US'
    );

}


function pct(p,t){

  return t
    ? ((p/t)*100).toFixed(1)
    : '0.0';

}


function esc(s){

  return String(s ?? '')
    .replace(
      /[&<>"']/g,
      c => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#039;'
      }[c])
    );

}


/* ---------------- TOTALS ---------------- */

function totals(){

  const assets =
    DATA.assets.reduce(
      (s,a) =>
        s + Number(a.value || 0),
      0
    );

  const liabilities =
    DATA.liabilities.reduce(
      (s,l) =>
        s + Number(l.outstanding || 0),
      0
    );

  const income =
    DATA.income.reduce(
      (s,i) =>
        s + Number(i.amount || 0),
      0
    );

  const expenses =
    DATA.expenses.reduce(
      (s,e) =>
        s + Number(e.amount || 0),
      0
    );

  return {

    assets,

    liabilities,

    net:
      assets - liabilities,

    income,

    expenses,

    surplus:
      income - expenses

  };

}



/* ---------------- LIABILITY STATS ---------------- */

function liabilityStats(){

  const totalOutstanding =
    DATA.liabilities.reduce(
      (s,l) => s + Number(l.outstanding || 0),
      0
    );

  const totalAnnualInterest =
    DATA.liabilities.reduce(
      (s,l) =>
        s + (
          Number(l.outstanding || 0) *
          (Number(l.rate || 0) / 100)
        ),
      0
    );

  const weightedRate =
    totalOutstanding > 0
      ? (totalAnnualInterest / totalOutstanding) * 100
      : 0;

  const highest =
    DATA.liabilities.reduce(
      (max,l) =>
        (Number(l.rate || 0) > (max?.rate || 0))
          ? l
          : max,
      null
    );

  return {
    totalOutstanding,
    totalAnnualInterest,
    weightedRate,
    highest,
    count: DATA.liabilities.length
  };
}

function createLocalProfile(){

  const identifier =
    (
      document.getElementById(
        'regIdentifier'
      )?.value || ''
    ).trim();


  const name =
    (
      document.getElementById(
        'regName'
      )?.value || ''
    ).trim();


  const secret =
    (
      document.getElementById(
        'regSecret'
      )?.value || ''
    ).trim();


  if(
    !identifier ||
    !name ||
    !secret
  ){

    showToast(
      'Please complete all fields'
    );

    return;

  }


  if(
    regMode === 'email' &&
    !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
      identifier
    )
  ){

    showToast(
      'Enter a valid email'
    );

    return;

  }


  if(
    regMode === 'phone' &&
    !/^[+0-9 ()-]{7,20}$/.test(
      identifier
    )
  ){

    showToast(
      'Enter a valid phone number'
    );

    return;

  }


  authUser = {
    name,
    identifier,
    type:regMode
  };


  localStorage.setItem(
    'wa-user',
    JSON.stringify(authUser)
  );


  document.getElementById(
    'mainContent'
  ).className =
    'flex-1 overflow-y-auto pb-28 px-4 pt-4';


  render('dashboard');

  showToast(
    'Welcome to WealthApp'
  );

}

/* =========================================================
   CLEAN CHART LABEL PLUGIN
   ========================================================= */

const chartLabelsPlugin = {

  id:'wealthLabels',


  afterDatasetsDraw(chart){

    if(
      !chart.data?.datasets?.length
    ) return;


    const ctx =
      chart.ctx;


    const dark =
      document.documentElement
        .classList
        .contains('dark');


    /*
      PIE / DOUGHNUT
    */

    if(
      chart.config.type === 'doughnut'
    ){

      const dataset =
        chart.data.datasets[0];


      const meta =
        chart.getDatasetMeta(0);


      const values =
        dataset.data.map(
          v => Number(v || 0)
        );


      const total =
        values.reduce(
          (a,b) => a+b,
          0
        );


      if(!total) return;


      ctx.save();


      meta.data.forEach(
        (element,i) => {

          if(element.hidden)
            return;


          const raw =
            values[i];


          if(!raw)
            return;


          const props =
            element.getProps(
              [
                'x',
                'y',
                'startAngle',
                'endAngle',
                'outerRadius'
              ],
              true
            );


          const angle =
            (
              props.startAngle +
              props.endAngle
            ) / 2;


          const startRadius =
            props.outerRadius + 3;


          const elbowRadius =
            props.outerRadius + 20;


          const x1 =
            props.x +
            Math.cos(angle) *
            startRadius;


          const y1 =
            props.y +
            Math.sin(angle) *
            startRadius;


          const x2 =
            props.x +
            Math.cos(angle) *
            elbowRadius;


          const y2 =
            props.y +
            Math.sin(angle) *
            elbowRadius;


          const direction =
            Math.cos(angle) >= 0
              ? 1
              : -1;


          const lineLength =
            38;


          const x3 =
            x2 +
            direction *
            lineLength;


          const y3 =
            y2;


          const label =
            String(
              chart.data.labels?.[i] || ''
            );


          const percent =
            (
              (raw / total) *
              100
            ).toFixed(1) + '%';


          /*
            Leader line
          */

          ctx.beginPath();

          ctx.moveTo(
            x1,
            y1
          );

          ctx.lineTo(
            x2,
            y2
          );

          ctx.lineTo(
            x3,
            y3
          );


          ctx.strokeStyle =
            dataset.backgroundColor?.[i] ||
            '#128C7E';


          ctx.lineWidth =
            1.5;


          ctx.stroke();


          /*
            Arrow
          */

          const arrowSize =
            4;


          ctx.beginPath();


          if(direction === 1){

            ctx.moveTo(
              x3,
              y3
            );

            ctx.lineTo(
              x3 - arrowSize,
              y3 - arrowSize
            );


            ctx.moveTo(
              x3,
              y3
            );

            ctx.lineTo(
              x3 - arrowSize,
              y3 + arrowSize
            );

          }else{

            ctx.moveTo(
              x3,
              y3
            );

            ctx.lineTo(
              x3 + arrowSize,
              y3 - arrowSize
            );


            ctx.moveTo(
              x3,
              y3
            );

            ctx.lineTo(
              x3 + arrowSize,
              y3 + arrowSize
            );

          }


          ctx.stroke();


          /*
            Text
          */

          const textX =
            x3 +
            direction *
            5;


          ctx.textAlign =
            direction === 1
              ? 'left'
              : 'right';


          ctx.textBaseline =
            'middle';


          ctx.font =
            '600 10px Inter, sans-serif';


          ctx.fillStyle =
            dark
              ? '#E7F8F2'
              : '#334155';


          let displayName =
            label;


          if(
            displayName.length > 18
          ){

            displayName =
              displayName.substring(
                0,
                18
              ) + '…';

          }


          ctx.fillText(
            displayName,
            textX,
            y3 - 6
          );


          ctx.font =
            '800 10px Inter, sans-serif';


          ctx.fillStyle =
            dataset.backgroundColor?.[i] ||
            '#128C7E';


          ctx.fillText(
            percent,
            textX,
            y3 + 7
          );

        }
      );


      ctx.restore();

    }

    /*
      BAR CHART:
      Intentionally no permanent labels.
      Values appear via tooltip.
    */

  }

};

/* ---------------- SAVE CATEGORY ---------------- */

function saveCategory(){

  const name =
    document.getElementById(
      'mCName'
    ).value.trim() ||
    'Custom Category';


  const icon =
    document.getElementById(
      'mCIcon'
    ).value;


  const color =
    document.getElementById(
      'mCColor'
    ).value;


  const file =
    document.getElementById(
      'mCImage'
    ).files[0];


  const finish =
    image => {

      const obj = {

        id:
          editing.id ||
          'cat' + Date.now(),

        name,

        icon,

        color,

        image:
          image || null

      };


      if(editing.id){

        const i =
          DATA.categories.findIndex(
            c =>
              c.id ===
              editing.id
          );


        if(i >= 0){

          if(
            !file &&
            DATA.categories[i].image
          ){

            obj.image =
              DATA.categories[i].image;

          }


          DATA.categories[i] =
            obj;

        }

      }else{

        DATA.categories.push(obj);

      }


      saveData();

      openCategoryModal();

      showToast(
        'Category saved'
      );

    };


  if(file){

    const reader =
      new FileReader();


    reader.onload =
      () => finish(
        reader.result
      );


    reader.readAsDataURL(
      file
    );

  }else{

    finish(null);

  }

}


/* ---------------- DELETE CATEGORY ---------------- */

function deleteCategory(id){

  const used =
    DATA.assets.some(
      a => a.cat === id
    );


  if(used){

    showToast(
      'Category is in use by assets'
    );

    return;

  }


  if(
    DATA.categories.length <= 1
  ){

    showToast(
      'Keep at least one category'
    );

    return;

  }


  if(
    !confirm(
      'Delete this category?'
    )
  ) return;


  DATA.categories =
    DATA.categories.filter(
      c => c.id !== id
    );


  saveData();

  openCategoryModal();

  showToast(
    'Category deleted'
  );

}

/* ---------------- CHAT HELPERS ---------------- */

function addChat(
  role,
  text
){

  chatHistory.push({
    role,
    text
  });


  if(
    currentView === 'chat'
  ){

    renderChat();

  }

}


function sendChat(){

  const input =
    document.getElementById(
      'chatInput'
    );


  const text =
    (
      input?.value || ''
    ).trim();


  if(!text)
    return;


  addChat(
    'user',
    text
  );


  input.value = '';


  processCommand(
    text
  );

}


function startVoice(){

  if(!recognition){

    showToast(
      'Voice not supported on this browser'
    );

    return;

  }


  showToast(
    'Listening... Speak now'
  );


  recognition.start();

}


/* ---------------- COMMAND PROCESSOR ---------------- */

function processCommand(text){

  const lower =
    text.toLowerCase();


  let reply = '';


  const amountMatch =
    text.match(
      /(?:rs\.?|inr|₹|\$)?\s*([\d,]+(?:\.\d+)?)\s*(?:lakh|lac|l|cr|crore)?/i
    );


  let amount =
    amountMatch
      ? parseFloat(
          amountMatch[1]
            .replace(/,/g,'')
        )
      : null;


  if(
    amount &&
    /lakh|lac\b|\bl\b/i.test(text)
  ){

    amount *= 100000;

  }


  if(
    amount &&
    /crore|\bcr\b/i.test(text)
  ){

    amount *= 10000000;

  }


  const isCredit =
    /(?:credited|credit|received|cr\b|deposit)/i
      .test(text);


  const isDebit =
    /(?:debited|debit|spent|paid|dr\b|withdrawn)/i
      .test(text);


  if(
    isCredit &&
    amount
  ){

    DATA.income.push({

      id:
        'i' + Date.now(),

      name:
        'SMS Credit',

      amount,

      cat:
        'Other'

    });


    saveData();


    reply =
      `Detected credit of ${convFull(amount)}. Added to Income.`;

  }


  else if(
    isDebit &&
    amount
  ){

    let cat =
      'Other';


    if(
      /grocery|supermarket|bigbasket|blinkit/i
        .test(text)
    ){

      cat =
        'Grocery';

    }

    else if(
      /fuel|petrol|diesel/i
        .test(text)
    ){

      cat =
        'Transport';

    }

    else if(
      /swiggy|zomato|restaurant|dining/i
        .test(text)
    ){

      cat =
        'Dining';

    }

    else if(
      /amazon|flipkart|myntra|shopping/i
        .test(text)
    ){

      cat =
        'Shopping';

    }


    DATA.expenses.push({

      id:
        'e' + Date.now(),

      name:
        'SMS Debit',

      amount,

      cat

    });


    saveData();


    reply =
      `Detected debit of ${convFull(amount)} (${cat}). Added to Expenses.`;

  }


  else if(
    /add.*(expense|spent)/i
      .test(lower) &&
    amount
  ){

    let cat =
      'Other';


    if(
      /grocery/i.test(lower)
    )
      cat = 'Grocery';


    if(
      /fuel|petrol/i.test(lower)
    )
      cat = 'Transport';


    if(
      /food|dining|restaurant/i.test(lower)
    )
      cat = 'Dining';


    DATA.expenses.push({

      id:
        'e' + Date.now(),

      name:
        'Voice Expense',

      amount,

      cat

    });


    saveData();


    reply =
      `Added expense of ${convFull(amount)} under ${cat}.`;

  }


  else if(
    /add.*(income|salary|received)/i
      .test(lower) &&
    amount
  ){

    DATA.income.push({

      id:
        'i' + Date.now(),

      name:
        'Voice Income',

      amount,

      cat:
        'Other'

    });


    saveData();


    reply =
      `Added income of ${convFull(amount)}.`;

  }


  else if(
    /net worth|total wealth|my wealth/i
      .test(lower)
  ){

    reply =
      `Your current Net Worth is ${conv(totals().net)}.`;

  }


  else if(
    /surplus|saving/i
      .test(lower)
  ){

    reply =
      `This month surplus is ${conv(totals().surplus)}.`;

  }


  else if(
    /gold/i.test(lower) &&
    amount
  ){

    const gold =
      DATA.categories.find(
        c => c.id === 'gold'
      );


    const item =
      DATA.assets.find(
        a => a.cat === 'gold'
      );


    if(item){

      item.value =
        amount;


      saveData();


      reply =
        `Updated ${item.name} to ${conv(amount)}.`;

    }

    else if(gold){

      DATA.assets.push({

        id:
          'a' + Date.now(),

        cat:
          'gold',

        name:
          'Gold',

        value:
          amount,

        owner:
          'Self'

      });


      saveData();


      reply =
        `Added Gold at ${conv(amount)}.`;

    }

  }


  else{

    reply =
      `I understood: "${text}".

Try:

• Paste a bank SMS
• “Add grocery expense 2500”
• “Show my net worth”
• “Update gold to 3.2 lakh”`;

  }


  setTimeout(
    () => {

      addChat(
        'bot',
        reply
      );


      showToast(
        'Updated'
      );


      render(
        currentView
      );

    },
    350
  );

}

/* =========================================================
   TOAST
   ========================================================= */

function showToast(msg){

  document.getElementById(
    'toastMsg'
  ).textContent =
    msg;


  const t =
    document.getElementById(
      'toast'
    );


  t.classList.remove(
    'hidden'
  );


  clearTimeout(
    window.__toastTimer
  );


  window.__toastTimer =
    setTimeout(
      () => {

        t.classList.add(
          'hidden'
        );

      },
      2200
    );

}
